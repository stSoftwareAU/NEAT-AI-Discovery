# Gitleaks configuration for NEAT-AI-Discovery.
#
# Referenced explicitly by .github/workflows/gitleaks.yml via --config.
# It lives under .github/ (rather than the conventional root
# .gitleaks.toml) because the repository's .gitignore ignores all hidden
# root files (.*), and a root .gitleaks.toml is on neither the ignore
# negation list nor the Vibe Coder commit-safety hidden-file allowlist.
#
# Extends the upstream default ruleset (useDefault = true) so every
# built-in secret rule stays active, then adds one narrowly-scoped
# allowlist for synthetic test fixtures.
#
# The remove-neuron propagation fixtures embed a "key" field holding a
# deterministic fixture identifier, e.g.
#   "key": "v2_remove-neuron_neuron-1802938338"
# The generic-api-key rule mis-detects this high-entropy identifier as a
# credential. These files contain only synthetic model/analysis data
# generated by the test harness — no real secrets — so the finding is a
# false positive. The allowlist is restricted to this fixture directory
# and to the generic-api-key rule, keeping secret scanning fully active
# everywhere else.
[extend]
useDefault = true

[[allowlists]]
description = "Synthetic remove-neuron propagation test fixtures (no real secrets)"
targetRules = ["generic-api-key"]
paths = [
  '''tests/fixtures/remove_neuron_propagation/.*\.json''',
]
