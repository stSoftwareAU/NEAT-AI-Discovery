name: ShellCheck

# Shell-script gates for pull requests:
#   1. `bash -n` syntax gate via the committed `quality/bash_syntax.sh`
#      (Issue #1755) — bash has no compile step, so without this a syntax
#      error can land on the default branch.
#   2. ShellCheck lint (upstream: koalaman/shellcheck —
#      https://github.com/koalaman/shellcheck). The ludeeus/action-shellcheck
#      action wraps the official koalaman/shellcheck binary.

on:
  pull_request:
    # "*" matches single-level branch names (e.g. Develop) but not
    # milestone/<slug>, since the "*" glob does not span "/". Add
    # "milestone/*" so milestone sub-issue PRs are gated too (Issue #1655).
    branches: ["*", "milestone/*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # ShellCheck lint over all bash scripts — light job, 10 minute cap
    # (Issue #1287).
    timeout-minutes: 10
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Do not persist GITHUB_TOKEN to .git/config — this job only lints
          # scripts and never pushes back or fetches private submodules
          # (Issue #1649).
          persist-credentials: false
      - name: Bash syntax gate (bash -n)
        # Committed gate script — the same one ./quality.sh runs locally
        # (Issue #1755). Fails the build on any syntax error.
        shell: bash
        run: ./quality/bash_syntax.sh .
      - name: Run ShellCheck (koalaman/shellcheck)
        # Pinned to a 40-char commit SHA (Issue #1215) to mitigate
        # supply-chain risk from mutable upstream branches. Update via
        # Renovate/Dependabot or by manually resolving the latest release.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: .
          severity: warning
