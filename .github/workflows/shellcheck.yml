name: ShellCheck

# Shell-script gates for pull requests:
#   1. `bash -n` syntax gate via the committed `quality/bash_syntax.sh`
#      (Issue #1755) — bash has no compile step, so without this a syntax
#      error can land on the default branch.
#   2. ShellCheck lint via the committed `quality/shellcheck.sh` (Issue #1898)
#      — the same gate ./quality.sh runs locally. The binary comes straight
#      from upstream koalaman/shellcheck (https://github.com/koalaman/shellcheck)
#      releases, installed by taiki-e/install-action. No third-party wrapper
#      action sits in between: the previous ludeeus/action-shellcheck wrapper
#      was unmaintained (last release Jan 2023, last push Jun 2024) and would
#      never receive a fix if it broke.

on:
  pull_request:
    # "*" matches single-level branch names (e.g. Develop) but not
    # milestone/<slug>, since the "*" glob does not span "/". Add
    # "milestone/*" so milestone sub-issue PRs are gated too (Issue #1655).
    branches: ["*", "milestone/*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    # ShellCheck lint over all bash scripts — light job, 10 minute cap
    # (Issue #1287).
    timeout-minutes: 10
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Do not persist GITHUB_TOKEN to .git/config — this job only lints
          # scripts and never pushes back or fetches private submodules
          # (Issue #1649).
          persist-credentials: false
      - name: Bash syntax gate (bash -n)
        # Committed gate script — the same one ./quality.sh runs locally
        # (Issue #1755). Fails the build on any syntax error.
        shell: bash
        run: ./quality/bash_syntax.sh .
      - name: Install ShellCheck (koalaman/shellcheck)
        # Pinned to a 40-char commit SHA (Issue #1215) to mitigate
        # supply-chain risk from mutable upstream branches. Update via
        # Renovate/Dependabot or by manually resolving the latest release.
        # The tool version is pinned too, so CI lints with a known binary.
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: shellcheck@0.11.0
      - name: Run ShellCheck (koalaman/shellcheck)
        # Committed gate script — the same one ./quality.sh runs locally
        # (Issue #1898), so local and CI enforce identical rules.
        shell: bash
        run: ./quality/shellcheck.sh .
