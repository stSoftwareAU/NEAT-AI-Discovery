# ==============================================================================
# CRITICAL: Do NOT modify this workflow without explicit approval.
# This file is essential for PR checks and should match the Develop branch.
# Restoring from Develop: git checkout Develop -- .github/workflows/ci.yml
# ==============================================================================

name: CI/CD Pipeline

on:
  # Checker workflow — gate the pull request only. No `push:` trigger to
  # `Develop`: every job here is guarded `if: github.event_name ==
  # 'pull_request'`, so a post-merge push run would only re-run checks that
  # already passed on the PR, wasting runner capacity (Issue #1564).
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
      # Milestone feature branches (milestone/<slug>, no nested slashes) so the
      # gate runs on milestone sub-issue PRs too, not just the rollup into
      # Develop (Issue #1651). The single-level `milestone/*` glob is sufficient.
      - milestone/*
  workflow_dispatch: # Allow manual trigger if needed

# Cancel superseded runs on the same ref (Issue #1288). When a contributor
# force-pushes a PR or lands several commits to Develop in quick succession,
# in-flight runs are cancelled so the latest commit's checks finish sooner
# and runner capacity is not wasted on stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal top-level permissions — narrow the default GITHUB_TOKEN scope to
# read-only for unprivileged jobs (quality, validation, spell-check). Jobs
# that need write access (version-increment, auto-format) declare their own
# per-job `permissions:` blocks which override this default.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  
jobs:
  version-increment:
    name: Auto-increment Versions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Cap runtime to surface wedged `cargo install` / `git fetch` steps
    # as fast failures rather than letting them tie up a runner for the
    # GitHub default 6h (Issue #1287).
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24) to avoid the
      # Node.js 20 deprecation warning that will become a hard error on
      # GitHub-hosted runners from September 2026 onwards.
      # Replaces v4.2.2 (11bd71901bbe5b1630ceea73d27597364c9af683).
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        # The write-capable ACTIONS_PUSH PAT is NOT handed to checkout: with
        # `persist-credentials: true` (the default) it lands in `.git/config`
        # where the later `cargo install` build scripts could read it. The PAT
        # is supplied per-step via an authenticated remote URL instead
        # (Issue #1868).
        persist-credentials: false

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull latest changes
      env:
        HEAD_REF: ${{ github.head_ref }}
        ACTIONS_PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        git pull "https://x-access-token:${ACTIONS_PUSH_TOKEN}@github.com/${REPOSITORY}.git" "$HEAD_REF"

    - name: Fetch base branch
      env:
        ACTIONS_PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        REMOTE_URL="https://x-access-token:${ACTIONS_PUSH_TOKEN}@github.com/${REPOSITORY}.git"
        git fetch "$REMOTE_URL" "+Develop:refs/remotes/origin/Develop" \
          || git fetch "$REMOTE_URL" "+develop:refs/remotes/origin/develop" \
          || true

    - name: Install Rust toolchain
      # Driven by the runner's preinstalled rustup instead of
      # the dtolnay rust-toolchain action (Issue #1891). The action's tarball is fetched
      # from codeload.github.com during "Prepare all required actions", where
      # the 100 s HttpClient timeout and 3-attempt retry policy are
      # runner-internal and not tunable from a workflow — a stall there fails
      # the job before any repository code runs. The committed script keeps the
      # immutable-code property of the SHA pin (Issue #1216) by removing the
      # third-party action from the critical path altogether.
      shell: bash
      run: ./scripts/install-rust-toolchain.sh

    - name: Install cargo-outdated
      # Pinned to a reviewed release and --locked so the plugin's own
      # Cargo.lock is honoured. Without both flags a poisoned new
      # release of cargo-outdated (or any transitive dep) would execute
      # via build.rs with this job's ACTIONS_PUSH token. See Issue #1223.
      run: cargo install --locked --version 0.16.0 cargo-outdated
        
    - name: Check for source changes and increment version
      shell: bash
      run: |
        set -euo pipefail
        # Determine base branch name (try Develop first, then develop)
        BASE_BRANCH="Develop"
        if ! git show-ref --verify --quiet refs/remotes/origin/Develop; then
          BASE_BRANCH="develop"
        fi
        
        # FIRST: Check if a version increment commit already exists in this PR branch
        # This is the most reliable way to prevent duplicate increments
        if git show-ref --verify --quiet refs/remotes/origin/$BASE_BRANCH; then
          # Check if there's already a version increment commit in PR branch that's not in base branch
          VERSION_COMMIT_COUNT=$(git log --oneline origin/$BASE_BRANCH..HEAD --grep="chore: auto-increment versions for changed projects" | wc -l)
          if [ "$VERSION_COMMIT_COUNT" -gt 0 ]; then
            echo "✅ Version increment commit already exists in this PR branch (found $VERSION_COMMIT_COUNT commit(s))"
            echo "Skipping version increment to avoid duplicate commits"
            exit 0
          fi
        fi
        
        # SECOND: Check if version is already different from the base branch
        # If the version on the PR branch differs from base branch, skip increment (already done)
        # This prevents duplicate version increments on the same PR
        if git show-ref --verify --quiet refs/remotes/origin/$BASE_BRANCH; then
          BASE_VERSION=$(git show origin/$BASE_BRANCH:Cargo.toml 2>/dev/null | grep '^version = ' | sed 's/version = "\(.*\)"/\1/' || echo "")
          CURRENT_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          
          if [ -n "$BASE_VERSION" ] && [ -n "$CURRENT_VERSION" ]; then
            echo "Base branch version: $BASE_VERSION"
            echo "PR branch version: $CURRENT_VERSION"
            
            # If versions are different, version has already been incremented for this PR
            if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
              echo "✅ Version is already different from base branch ($BASE_VERSION -> $CURRENT_VERSION)"
              echo "Skipping version increment to avoid duplicate commits"
              exit 0
            fi
          fi
        fi
        
        # Get current version from Cargo.toml
        CURRENT_VERSION=$(grep '^version = ' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
        echo "Current version: $CURRENT_VERSION"
        
        # Increment patch version
        # Normalize version to always have 3 parts (major.minor.patch)
        # Default missing parts to 0 (e.g., "1.0" becomes "1.0.0")
        IFS='.' read -r major minor patch <<< "$CURRENT_VERSION"
        major=${major:-0}
        minor=${minor:-0}
        patch=${patch:-0}
        NEW_VERSION="$major.$minor.$((patch + 1))"
        echo "New version: $NEW_VERSION"
        
        # Update Cargo.toml with new version (escape regex meta characters in CURRENT_VERSION)
        # Use a single escape pass to avoid double-escaping backslashes
        ESCAPED_CURRENT=$(printf '%s' "$CURRENT_VERSION" | sed 's/[\/.^$*+?()[\]{}|]/\\&/g')
        sed -i.bak "s/^version = \"$ESCAPED_CURRENT\"/version = \"$NEW_VERSION\"/" Cargo.toml
        rm Cargo.toml.bak
        
        echo "✅ Version updated from $CURRENT_VERSION to $NEW_VERSION"
        
        # Record the new crate version in Cargo.lock and nothing else. A bare
        # `cargo update` re-resolves every direct and transitive dependency to
        # the newest published version with no age check, bypassing the
        # quarantine window (Issue #1878). Dependency movement belongs to
        # ./bump-deps.sh and Renovate, which enforce it.
        cargo update --workspace
        cargo outdated -R || true

        # Fail loud rather than pushing an unquarantined dependency graph:
        # this job commits whatever is in the tree with the ACTIONS_PUSH PAT,
        # so the lockfile diff must be exactly this crate's own version bump.
        LOCK_DIFF=$(git diff --unified=0 -- Cargo.lock | grep -E '^[-+][^-+]' || true)
        EXPECTED_DIFF=$(printf -- '-version = "%s"\n+version = "%s"' "$CURRENT_VERSION" "$NEW_VERSION")
        if [ "$LOCK_DIFF" != "$EXPECTED_DIFF" ]; then
          echo "::error::Cargo.lock moved beyond the version bump — dependency updates must go through ./bump-deps.sh or Renovate (Issue #1878)"
          echo "$LOCK_DIFF"
          exit 1
        fi

    - name: Check if there are changes
      id: changes
      shell: bash
      env:
        HEAD_REF: ${{ github.head_ref }}
        ACTIONS_PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        if ! git diff --quiet; then
          git add -A
          git commit -m "chore: auto-increment versions for changed projects"
          git push "https://x-access-token:${ACTIONS_PUSH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:$HEAD_REF"
        else
          echo "No version changes to commit"
        fi

  quality:
    name: Quality Checks
    # GPU tests are skipped automatically when no GPU is available.
    # Set NEAT_CI_RUNNER to a GPU-enabled runner label for full test coverage.
    runs-on: 'ubuntu-latest'
    if: github.event_name == 'pull_request'
    needs: [version-increment, auto-format]
    # Heaviest job: Rust compile, clippy, full test suite. 45 minutes
    # leaves headroom for cold caches while still firing well before
    # the 6h GitHub default (Issue #1287).
    timeout-minutes: 45
    env:
      RUSTFLAGS: "-D warnings"
    
    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24) to avoid the
      # Node.js 20 deprecation warning that will become a hard error on
      # GitHub-hosted runners from September 2026 onwards.
      # Replaces v4.2.2 (11bd71901bbe5b1630ceea73d27597364c9af683).
      # The "Pull latest changes" step that previously followed this has been
      # removed: the checkout already fetches the PR head ref with
      # fetch-depth: 0, so the extra `git pull` is redundant. It also failed
      # for the quality job because GITHUB_TOKEN does not carry HTTPS
      # credentials for unauthenticated git operations.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        # The quality job only fetches, builds, and tests — it never pushes
        # back to the repository. Do not persist the GITHUB_TOKEN in
        # .git/config so a compromised later step cannot read it (Issue #1643).
        persist-credentials: false

    - name: Free up runner disk space
      shell: bash
      run: |
        set -euo pipefail
        # GitHub runners start with ~17GB free but Rust builds can exceed this.
        # Remove large pre-installed software we don't need to free 10-20GB.
        echo "Disk usage before cleanup:"
        df -h /
        sudo rm -rf /usr/share/dotnet      # ~3GB
        sudo rm -rf /usr/local/lib/android # ~14GB
        sudo rm -rf /opt/ghc               # ~5GB (Haskell)
        sudo rm -rf /opt/hostedtoolcache/CodeQL # ~1GB
        sudo rm -rf /usr/share/swift       # ~1.5GB
        echo "Disk usage after cleanup:"
        df -h /

    - name: Install Rust toolchain
      # Driven by the runner's preinstalled rustup instead of
      # the dtolnay rust-toolchain action (Issue #1891) — see the version-increment job
      # above for the full rationale.
      shell: bash
      run: ./scripts/install-rust-toolchain.sh stable rustfmt clippy

    - name: Disk usage (before cache)
      run: |
        # CI diagnostic (2 Jan 2026): Rust builds can consume significant disk (especially `target/`).
        # If a job fails with ENOSPC, this makes the cause obvious in logs.
        df -h

    - name: Cache dependencies
      # Pinned to a 40-char commit SHA (Issue #1216).
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        # Important (2 Jan 2026): do NOT cache `target/` in CI.
        # It can exceed GitHub runner disk limits after restore + build, causing ENOSPC failures.
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-cargo-

    - name: Disk usage (after cache restore)
      run: df -h
      
    - name: Check formatting
      run: cargo fmt --all -- --check
      
    - name: Run linter
      run: cargo clippy --all-targets --all-features -- -D warnings -D clippy::uninlined_format_args -D clippy::filter_next -D clippy::collapsible_if

    - name: Build library
      run: cargo build --lib

    - name: Clean intermediate artefacts before tests
      shell: bash
      run: |
        set -euo pipefail
        # Test compilation generates many large binaries. Remove incremental
        # compilation data and fingerprints to free space before this step.
        echo "Disk usage before cleanup:"
        df -h /
        find target -name "incremental" -type d -exec rm -rf {} + 2>/dev/null || true
        find target -name ".fingerprint" -type d -exec rm -rf {} + 2>/dev/null || true
        find target -name "build" -type d -exec rm -rf {} + 2>/dev/null || true
        echo "Disk usage after cleanup:"
        df -h /

    - name: Run tests
      run: cargo test --lib --tests --bins --all-features --verbose -- --test-threads=2

  security:
    uses: ./.github/workflows/security.yml
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # Reusable security.yml requests issues: write for dependency-review-action,
    # which posts its PR summary comment through the Issues API. Override the
    # top-level read-only default so the caller can grant it (Issue #1286).
    # checks: write is no longer requested — the duplicate rustsec/audit-check
    # step that used the Checks API was removed (Issue #1657).
    permissions:
      contents: read
      issues: write
    with:
      include-dependency-review: true

  validation:
    name: Project Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # File-presence and Cargo.toml field validation — 10 minutes is plenty
    # while still capping wedged-runner exposure (Issue #1287).
    timeout-minutes: 10

    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # The validation job only checks for required files and Cargo.toml
        # fields — it never pushes back to the repository. Do not persist the
        # GITHUB_TOKEN in .git/config so a compromised later step cannot read
        # it (Issue #1644).
        persist-credentials: false

    - name: Check for required files
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Checking for required project files..."
        
        required_files=(
          "Cargo.toml"
          "README.md"
          "LICENSE"
          "src/lib.rs"
        )
        
        missing_files=()
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            missing_files+=("$file")
          fi
        done
        
        if [ ${#missing_files[@]} -ne 0 ]; then
          echo "❌ Missing required files: ${missing_files[*]}"
          exit 1
        else
          echo "✅ All required files present"
        fi

    - name: Validate Cargo.toml
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Validating Cargo.toml..."

        # Manifest resolvability is proven by the broader compile gate in
        # the `quality` job (Run linter) on the same pull request;
        # recompiling here only duplicated that work (Issue #1342).
        for field in "name" "version" "edition"; do
          if ! grep -vE "^[[:space:]]*#" Cargo.toml | grep -qE "^[[:space:]]*${field}[[:space:]]*="; then
            echo "❌ Missing '$field' field in Cargo.toml"
            exit 1
          fi
        done
        
        echo "✅ Cargo.toml validation passed"

    - name: Check documentation
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Checking documentation..."
        
        readme_lines=$(wc -l < README.md)
        if [ "$readme_lines" -lt 10 ]; then
          echo "❌ README.md seems too short (${readme_lines} lines)"
          exit 1
        fi
        
        if [ -f "src/lib.rs" ]; then
          doc_comments=$(grep -c "///" src/lib.rs || echo "0")
          if [ "$doc_comments" -eq 0 ]; then
            echo "⚠️  No documentation comments found in src/lib.rs"
          else
            echo "✅ Found $doc_comments documentation comments"
          fi
        fi

  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # rustfmt + commit-and-push; 15 minutes covers a cold toolchain
    # install while still bounding hangs (Issue #1287).
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    
    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        # Keep the ACTIONS_PUSH PAT out of `.git/config`; the push step
        # authenticates with an explicit remote URL instead (Issue #1868).
        persist-credentials: false

    - name: Ensure bash scripts are executable
      shell: bash
      run: |
        set -euo pipefail
        echo "🔍 Ensuring all bash scripts are executable..."
        CHANGED=false
        while IFS= read -r script; do
          if [ ! -x "$script" ]; then
            echo "Making $script executable..."
            chmod +x "$script"
            CHANGED=true
          else
            echo "✅ $script is already executable"
          fi
        done < <(find . -name "*.sh" -not -path "./target/*" -not -path "./.git/*")
        if [ "$CHANGED" = true ]; then
          echo "Scripts were made executable"
        else
          echo "All scripts are already executable"
        fi

    - name: Install Rust toolchain
      # Driven by the runner's preinstalled rustup instead of
      # the dtolnay rust-toolchain action (Issue #1891) — see the version-increment job
      # above for the full rationale.
      shell: bash
      run: ./scripts/install-rust-toolchain.sh stable rustfmt clippy

    - name: Format Code
      run: cargo fmt

    - name: Check for Changes
      id: check_changes
      run: |
        if git diff --quiet; then
          echo "has_changes=false" >> $GITHUB_OUTPUT
        else
          echo "has_changes=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit Changes
      if: steps.check_changes.outputs.has_changes == 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit -am "chore: apply rustfmt fixes"

    - name: Push Changes
      if: steps.check_changes.outputs.has_changes == 'true'
      env:
        HEAD_REF: ${{ github.head_ref }}
        ACTIONS_PUSH_TOKEN: ${{ secrets.ACTIONS_PUSH }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        git push "https://x-access-token:${ACTIONS_PUSH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:$HEAD_REF"

  # Shell script linting is handled by .github/workflows/shellcheck.yml
  # (quality/shellcheck.sh), which is a strict superset of `bash -n`
  # syntax checking. The previous `shell-checks` job duplicated that work
  # and was removed in #1158.

  spell-check:
    name: Spell Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [version-increment]
    # codespell over the tree — light job, 10 minute cap (Issue #1287).
    timeout-minutes: 10

    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        ref: ${{ github.head_ref }}
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
        # Spell-check only reads the tree (codespell); it never pushes back nor
        # fetches a private submodule, so the token must not be persisted to
        # .git/config where a later step could read it (Issue #1569).
        persist-credentials: false

    - name: Install codespell
      run: pip install --user codespell

    - name: Run codespell
      shell: bash
      run: |
        ~/.local/bin/codespell \
          --check-filenames \
          --check-hidden \
          --skip "./target,./.git,./tests/data" \
          --ignore-words-list "renderD,nknown,MAPE,OT,ND,MOT"

