name: Semgrep

on:
  pull_request:
    # `*` does not cross `/` in GitHub branch filters, so it never matches
    # `milestone/<slug>`. Add `milestone/*` so the SAST gate also runs on
    # milestone sub-issue PRs (Issue #1654).
    branches: ["*", "milestone/*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    # SAST scan over the tree — light job, 10 minute cap
    # (Issue #1287).
    timeout-minutes: 10
    container:
      # Pinned to semgrep/semgrep 1.163.0 (Issue #1258). The multi-arch
      # manifest digest below is immutable; Renovate's github-actions
      # manager does not track jobs.<job>.container.image, so the 24h
      # quarantine in renovate.json does not protect this surface — pin
      # to a content digest and let bump-deps.sh rotate it.
      image: semgrep/semgrep@sha256:7cad2bc2d1e44f87f0bf4be6d1fa23aa90fb72015bebc89fb91385d813987a03
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      # persist-credentials: false — this job only reads the tree for the
      # SAST scan; it never pushes back or fetches private submodules, so
      # the GITHUB_TOKEN must not be written to .git/config (Issue #1648).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      # Exclude renovate-missing-minimum-release-age (Issue #1490): this
      # repo enforces a deliberate, tested supply-chain quarantine of
      # >=24h (Issue #1234) via an explicit
      # `minimumReleaseAge` on every packageRule. The rule's premise —
      # "no minimum release age is set" — is false here; it fires only
      # because it hardcodes a >=7 day threshold and cannot express the
      # org's 24h standard, so no compliant value exists that also
      # satisfies the 24h invariant.
      #
      # What replaces it (Issue #1915): the structural audit in
      # tests/issue_1234_quarantine_enforcement.rs, which parses
      # renovate.json rather than substring-matching it —
      # `renovate_json_configures_minimum_release_age` requires every
      # packageRule to carry a >=24h window and every covered class
      # (cargo, github-actions, custom.regex) to be held, while
      # `zeroing_a_covered_rule_is_detected`,
      # `lowering_a_window_below_24h_is_detected` and
      # `a_new_zero_age_rule_outside_the_internal_bypass_is_detected`
      # pin the failure modes. Only the stSoftwareAU/* bypass rule may
      # set 0. bump-deps.sh enforces the same window at bump time.
      - run: |
          set -euo pipefail
          semgrep ci --config p/default \
            --exclude-rule package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age \
            --exclude-rule renovate-missing-minimum-release-age
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
