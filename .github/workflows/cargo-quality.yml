# Coverage workflow (Issue #1180, #1289).
#
# Trimmed to coverage-only: the repository's main CI workflow (`ci.yml`)
# already runs `cargo fmt --check` and `cargo clippy` with the full
# feature set and `RUSTFLAGS: "-D warnings"`, so the duplicate fmt and
# clippy steps that used to live here doubled CI runtime for two checks
# that always produce the same result. The fmt/clippy gate stays in
# `ci.yml/quality`; this workflow now exists solely to generate and
# upload Codecov coverage (Issue #1636).

name: Coverage

on:
  pull_request:
    # `"*"` matches single-level branch names (e.g. `Develop`) but not
    # `milestone/<slug>`, because the `*` glob does not cross `/`. Add
    # `milestone/*` so milestone sub-issue PRs are coverage-gated too
    # (Issue #1656). Milestone branch names carry no nested slashes, so a
    # single-level `milestone/*` glob is sufficient.
    branches: ["*", "milestone/*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # cargo-llvm-cov coverage build. Coverage instrumentation roughly
    # doubles build time, so 45 minutes mirrors the heaviest cargo job
    # (Issue #1287).
    timeout-minutes: 45
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      # Do not persist the GITHUB_TOKEN to .git/config: this job only reads
      # the checkout, builds coverage, and uploads to Codecov — it never
      # pushes back or fetches a private submodule, so keeping the token on
      # disk only widens the blast radius of a compromised step (Issue #1567).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        # Driven by the runner's preinstalled rustup instead of
        # the dtolnay rust-toolchain action (Issue #1891). The action's tarball is fetched
        # from codeload.github.com during "Prepare all required actions", where
        # the 100 s timeout and 3-attempt retry are runner-internal and not
        # tunable from a workflow. The committed script keeps the
        # immutable-code property of the SHA pin (Issue #1216) by dropping the
        # third-party action entirely.
        shell: bash
        run: ./scripts/install-rust-toolchain.sh

      - name: Install ShellCheck (koalaman/shellcheck)
        # The test suite runs quality/shellcheck.sh, so this job needs the same
        # pinned binary as .github/workflows/shellcheck.yml. Without it the gate
        # lints with the runner's preinstalled ShellCheck and the verdict drifts
        # with the runner image (PR #1972).
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: shellcheck@0.11.0

      # Coverage instrumentation and upload (Issue #1636).
      - name: Install cargo-llvm-cov
        # Pinned to the action's release SHA rather than the mutable
        # `@cargo-llvm-cov` shorthand tag (Issue #1216). The shorthand
        # tag is re-pointable by upstream maintainers; v2.79.0 is
        # immutable.
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        # Build every test binary without DWARF debug info. The coverage
        # build compiles the whole test suite with `-C instrument-coverage`
        # and, by default, `debuginfo=2`; the resulting instrumented
        # binaries exhaust the runner's disk during linking, which surfaces
        # as `ld terminated with signal 7 [Bus error]` (a SIGBUS from an
        # mmap write onto a full filesystem). Line/region coverage comes
        # from the embedded coverage map, not from DWARF, so dropping debug
        # info shrinks the artifacts sharply without affecting the report
        # (Issue #1489).
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        # Run the test binaries with `--test-threads=2` to match `ci.yml/quality`
        # and `quality.sh`. Parts of the suite share process-wide state (the
        # global tracking allocator counter) and wall-clock timing budgets that
        # are not robust to unbounded parallelism; `cargo llvm-cov` otherwise
        # defaults to one thread per core, which surfaces as spurious failures
        # (e.g. `tracking_alloc` / focus-ranking budget tests) under coverage
        # instrumentation only. Keeping the thread count aligned with the other
        # gates removes that divergence (PR #1515).
        # `--all-features` matches `ci.yml/quality` and `quality.sh` so the
        # off-by-default `regression-harness` target (Issue #1877) is measured
        # here too, rather than silently dropping out of the report.
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info -- --test-threads=2

      - name: Upload coverage to Codecov
        # Pinned to a 40-char commit SHA (Issue #1216).
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
