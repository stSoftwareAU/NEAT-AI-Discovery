# Coverage workflow (Issue #1180, #1289).
#
# Trimmed to coverage-only: the repository's main CI workflow (`ci.yml`)
# already runs `cargo fmt --check` and `cargo clippy` with the full
# feature set and `RUSTFLAGS: "-D warnings"`, so the duplicate fmt and
# clippy steps that used to live here doubled CI runtime for two checks
# that always produce the same result. The fmt/clippy gate stays in
# `ci.yml/quality`; this workflow now exists solely to generate and
# upload Codecov coverage (Issue #1636).

name: Coverage

on:
  pull_request:
    branches: ["*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # cargo-llvm-cov coverage build. Coverage instrumentation roughly
    # doubles build time, so 45 minutes mirrors the heaviest cargo job
    # (Issue #1287).
    timeout-minutes: 45
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24). Replaces v4.2.2.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        # Pinned to a SHA on the action's `stable` branch (Issue #1216).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Coverage instrumentation and upload (Issue #1636).
      - name: Install cargo-llvm-cov
        # Pinned to the action's release SHA rather than the mutable
        # `@cargo-llvm-cov` shorthand tag (Issue #1216). The shorthand
        # tag is re-pointable by upstream maintainers; v2.79.0 is
        # immutable.
        uses: taiki-e/install-action@7be9fd86bd1707236395105d6e9329dd1511a7e1 # v2.79.0
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage (lcov)
        # Build every test binary without DWARF debug info. The coverage
        # build compiles the whole test suite with `-C instrument-coverage`
        # and, by default, `debuginfo=2`; the resulting instrumented
        # binaries exhaust the runner's disk during linking, which surfaces
        # as `ld terminated with signal 7 [Bus error]` (a SIGBUS from an
        # mmap write onto a full filesystem). Line/region coverage comes
        # from the embedded coverage map, not from DWARF, so dropping debug
        # info shrinks the artifacts sharply without affecting the report
        # (Issue #1489).
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo llvm-cov --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        # Pinned to a 40-char commit SHA (Issue #1216).
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
