name: Markdown Lint

on:
  pull_request:
    branches: ["*"]
  push:
    branches: [main, master, Develop]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    # markdownlint-cli2 + optional Mermaid validation — light job,
    # 10 minute cap (Issue #1287).
    timeout-minutes: 10
    steps:
      # actions/checkout@v5
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      # actions/setup-node@v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Install markdownlint-cli2
        # Version-pinned and lifecycle scripts disabled to harden the
        # supply chain (Issue #1484): a poisoned release cannot silently
        # bump the resolved version or run install/postinstall scripts on
        # the runner. Renovate keeps this pin current under the shared
        # >=24h quarantine via the customManager in renovate.json.
        run: npm install -g --ignore-scripts markdownlint-cli2@0.23.0
      - name: Run markdownlint-cli2
        run: markdownlint-cli2
      # Optional: mirror the local check-mermaid quality gate when Deno
      # and the worker module are available in the repo (Issue #1683).
      - name: Detect Deno worker module
        id: detect-deno
        run: |
          if [ -f worker/deno/mod.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      # denoland/setup-deno@v2
      - if: steps.detect-deno.outputs.present == 'true'
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - if: steps.detect-deno.outputs.present == 'true'
        name: Validate Mermaid blocks
        run: deno run --allow-read --allow-env=DEBUG,LOG_LEVEL,CONFIG_PATH,OUTPUT_JSON worker/deno/mod.ts check-mermaid
