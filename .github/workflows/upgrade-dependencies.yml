# Upgrades Cargo.toml dependency version constraints on a weekly schedule.
# Creates a dedicated PR for dependency updates rather than modifying existing PR branches.
name: Upgrade Cargo Dependencies

on:
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    name: Upgrade dependencies and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to a 40-char commit SHA (Issue #1216).
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: Develop
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust
        # Pinned to a SHA on the action's `stable` branch (Issue #1216).
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Install cargo-edit
        # Pinned to a reviewed release and --locked so the plugin's own
        # Cargo.lock is honoured. Without both flags a poisoned new
        # release of cargo-edit (or any transitive dep) would execute
        # via build.rs with this job's contents: write /
        # pull-requests: write token before the auto-PR is opened. See
        # Issue #1223.
        run: cargo install --locked --version 0.13.6 cargo-edit

      - name: Upgrade dependencies (quarantine-gated)
        # Invoke bump-deps.sh so the VIBE_BUMP_QUARANTINE_HOURS gate is
        # actually applied (Issue #1234). A raw `cargo upgrade` here would
        # land any version published seconds before the cron fires —
        # exactly the supply-chain window the policy claims to close.
        env:
          VIBE_BUMP_QUARANTINE_HOURS: "24"
        run: |
          cargo upgrade --dry-run 2>&1 | tee upgrade-dry-run.txt || true
          ./bump-deps.sh 2>&1 | tee upgrade.log

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml / Cargo.lock dependency changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- 'Cargo.toml' '**/Cargo.toml' 'Cargo.lock'
          fi

      - name: Update Cargo.lock
        if: steps.changes.outputs.changed == 'true'
        run: cargo update

      - name: Build summary
        if: steps.changes.outputs.changed == 'true'
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo '## Dependency Upgrades'
            echo ''
            echo '### Changes'
            echo '```'
            cat upgrade-dry-run.txt
            echo '```'
            echo ''
            echo 'This PR was automatically generated by the scheduled dependency upgrade workflow.'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        # Pinned to a 40-char commit SHA (Issue #1216).
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/upgrade-dependencies
          base: Develop
          title: "chore: upgrade Cargo dependencies to latest compatible versions"
          body: ${{ steps.summary.outputs.body }}
          commit-message: "chore: upgrade Cargo.toml dependencies to latest compatible versions"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          delete-branch: true
