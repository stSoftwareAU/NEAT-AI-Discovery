name: actionlint

# Lints all GitHub Actions workflow files using actionlint (upstream:
# rhysd/actionlint — https://github.com/rhysd/actionlint). This is the
# CI lint gate for the `github-actions` bucket — workflow regressions
# (bad expressions, missing context, unsupported runner labels, etc.)
# fail the build on the pull request, before they reach Develop.
#
# As a checker (not a deploy/publish workflow), this gate runs on the
# pull request only. A post-merge `push:` run to the default branch
# (Develop) would merely duplicate the run that already gated the PR,
# wasting CI minutes — so no `push:` trigger is declared (Issue #1563).
#
# Issue #1292.
#
# Issue #2560: the job always runs, so the `actionlint` check always reports,
# but skips the lint unless `quality/lint_scope.sh` finds a relevant change.

on:
  pull_request:
    # Draft PRs are work in progress (owner, 2026-10-23): CI runs
    # once, when the PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
    # `"*"` gates single-level branches (Develop, main, feature/... top-level);
    # the `*` glob does not cross `/`, so `milestone/*` is added to also gate
    # milestone sub-issue PRs that target a shared `milestone/<slug>` branch
    # (Issue #1650).
    branches: ["*", "milestone/*"]

# Cancel superseded runs on the same ref (Issue #1288).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only top-level permissions — actionlint only reads workflow
# files (Issue #1286).
permissions:
  contents: read

jobs:
  actionlint:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    # actionlint over .github/workflows — light job, 10 minute cap
    # (Issue #1287).
    timeout-minutes: 10
    steps:
      # Pinned to actions/checkout v6.0.2 (Node.js 24) to match the
      # rest of the workflows in this repository (Issue #1216).
      # Do not persist the GITHUB_TOKEN to .git/config: this job only reads
      # the checkout and runs actionlint over .github/workflows — it never
      # pushes back or fetches a private submodule, so keeping the token on
      # disk only widens the blast radius of a compromised step (Issue #1566).
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # Fetch the base commit as well as HEAD: lint_scope.sh diffs HEAD^1
          # against HEAD to decide whether actionlint must run (Issue #2560).
          fetch-depth: 2

      # On a pull_request run HEAD is GitHub's merge commit and HEAD^1 the base
      # tip, so lint_scope.sh diffs exactly the PR's change set. It fails closed
      # (runs actionlint) when the diff cannot be read. The job itself always runs
      # so the required check name always reports (Issue #2560).
      - name: Detect relevant changes
        id: scope
        shell: bash
        run: ./quality/lint_scope.sh actionlint

      - name: Run actionlint
        if: steps.scope.outputs.run == 'true'
        # Pinned to raven-actions/actionlint v2.1.2 commit SHA
        # (Issue #1216). Update via Renovate or by manually resolving
        # the latest release SHA from
        # https://github.com/raven-actions/actionlint/releases.
        #
        # `shellcheck: false` disables actionlint's bundled shellcheck
        # invocation on workflow `run:` blocks. Shell scripts under the
        # repo root are already linted by .github/workflows/shellcheck.yml
        # (quality/shellcheck.sh); double-linting `run:` blocks here
        # would duplicate that coverage and surface findings against
        # ci.yml.
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          shellcheck: false
