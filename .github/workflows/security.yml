name: Security Reusable Workflow

on:
  workflow_call:
    inputs:
      include-dependency-review:
        description: 'Include dependency review'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  # dependency-review-action posts its PR summary comment through the Issues
  # API, so it needs issues write. The Checks-API write grant is deliberately
  # omitted — its only consumer was the RustSec audit-check action, removed as
  # a duplicate of the explicit cargo-audit path (Issue #1657).
  issues: write

jobs:
  security:
    runs-on: ubuntu-latest
    # cargo install cargo-audit + cargo-deny, both audit runs, and
    # dependency-review. Compiling the two plugins from source dominates
    # runtime; 30 minutes covers a cold build of both while still bounding
    # hangs (Issue #1287, Issue #1870).
    timeout-minutes: 30
    steps:
    - name: Checkout code
      # Pinned to actions/checkout v6.0.2 (Node.js 24) to avoid the
      # Node.js 20 deprecation warning that will become a hard error on
      # GitHub-hosted runners from September 2026 onwards.
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        # The security job only audits dependencies — it never pushes back
        # to the repository or fetches private submodules. Do not persist the
        # GITHUB_TOKEN in .git/config so a compromised later step cannot read
        # it (Issue #1647).
        persist-credentials: false

    - name: Install Rust toolchain
      # Driven by the runner's preinstalled rustup instead of
      # the dtolnay rust-toolchain action (Issue #1891). The action's tarball is fetched
      # from codeload.github.com during "Prepare all required actions", where
      # the 100 s timeout and 3-attempt retry are runner-internal and not
      # tunable from a workflow. The committed script keeps the immutable-code
      # property of the SHA pin (Issue #1216) by dropping the third-party
      # action entirely.
      shell: bash
      run: ./scripts/install-rust-toolchain.sh

    - name: Install cargo-audit
      # Pinned to a reviewed release and --locked so the plugin's own
      # Cargo.lock is honoured. Without both flags a poisoned new
      # release of cargo-audit (or any transitive dep) would execute via
      # build.rs with this workflow's issues-write GITHUB_TOKEN.
      # See Issue #1223.
      # Updated to 0.22.1: this version adds CVSS 4.0 support, which is
      # required to parse new advisory-db entries (e.g. RUSTSEC-2026-0076).
      # cargo-audit 0.21.x fails with "unsupported CVSS version: 4.0" and
      # exits 1, breaking the security scan.
      run: cargo install --locked --version 0.22.1 cargo-audit

    - name: Run security audit
      # Single RustSec advisory gate. Previously the RustSec audit-check action
      # ran a second time over the same Cargo.lock and advisory database; it was
      # removed as duplicate work (Issue #1657). The explicit path is kept
      # because it is version-pinned (0.22.1) for CVSS 4.0 support, whereas the
      # action resolved its own cargo-audit version.
      run: cargo audit

    - name: Install cargo-deny
      # Pinned and --locked for the same reason as cargo-audit above: without
      # both flags a poisoned release of cargo-deny (or any transitive dep)
      # would execute via build.rs with this workflow's GITHUB_TOKEN.
      run: cargo install --locked --version 0.20.2 cargo-deny

    - name: Run dependency policy check
      # Enforces deny.toml in CI (Issue #1870). cargo audit and
      # dependency-review check published *advisories* only; neither reads
      # deny.toml, so the [sources] policy (crates.io only — no git remotes,
      # no alternate registries), the [bans] table and the Apache-2.0
      # compatible [licenses] allow-list were advisory until this step. A PR
      # adding `foo = { git = "https://github.com/attacker/foo" }` bypasses
      # crates.io checksums entirely and previously passed every gate.
      run: cargo deny check

    - name: Dependency review
      if: ${{ inputs.include-dependency-review && github.event_name == 'pull_request' }}
      # Pinned to a 40-char commit SHA (Issue #1216). Updated to v5.0.0
      # (node24) to avoid the Node.js 20 deprecation hard error from June 2026.
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        comment-summary-in-pr: always
        # thrift ≤ 0.22.0 is affected by GHSA-2f9f-gq7v-9h6m (moderate —
        # Memory Allocation with Excessive Size Value). The RustSec advisory
        # database has no patched release; every published version is flagged.
        # thrift is a transitive dependency of parquet (Apache Arrow Parquet
        # crate) that encodes the Parquet file-format schema — it cannot be
        # removed without dropping parquet. Allow this advisory explicitly
        # and revisit when an upstream patch ships.
        allow-ghsas: GHSA-2f9f-gq7v-9h6m

