name: Security Reusable Workflow

on:
  workflow_call:
    inputs:
      include-dependency-review:
        description: 'Include dependency review'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-audit
      run: cargo install cargo-audit

    - name: Run security audit
      run: cargo audit

    - name: RustSec audit-check
      # Official RustSec GitHub Action — wraps cargo-audit and annotates
      # PRs / opens issues for newly disclosed advisories.
      uses: rustsec/audit-check@v2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Dependency review
      if: ${{ inputs.include-dependency-review && github.event_name == 'pull_request' }}
      uses: actions/dependency-review-action@v4
      with:
        comment-summary-in-pr: always

