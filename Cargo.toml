[package]
name = "neat_ai_discovery"
version = "0.74.110"
edition = "2024"
license = "Apache-2.0"
description = "High-performance Rust library for recording neuron activations and errors during NEAT-AI discovery, and scanning the recorded data to identify beneficial new synapses/neurons."
repository = "https://github.com/stSoftwareAU/NEAT-AI-Discovery"
readme = "README.md"

[lib]
name = "neat_ai_discovery"
crate-type = ["cdylib", "rlib"]  # cdylib for .so/.dylib, rlib for Rust integration.

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2"  # Typed domain error enums (Issue #677)
parquet = "59.0"  # Apache Parquet format (viewable with standard tools)
arrow = { version = "59.0", default-features = false }  # Arrow arrays for Parquet
wgpu = "29"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.12"
rand = "0.10"

crossbeam-channel = "0.5"  # Efficient multi-producer work queues for GPU thread
lz4_flex = "0.13"  # Pure Rust LZ4 compression for memory-constrained cache (Issue #420)
dashmap = "6.2"  # Lock-free concurrent HashMap for diagnostic aggregation (Issue #216)
parking_lot = { version = "0.12", features = ["deadlock_detection"] }  # Deadlock detection
signal-hook = "0.4"  # Signal handling (SIGUSR1 for thread dumps)
tracing = "0.1"  # Structured logging framework (Issue #575)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }  # Subscriber with EnvFilter (Issue #575)

[dev-dependencies]
tempfile = "3.27"
serial_test = "3.5"
criterion = { version = "0.8", default-features = false, features = ["rayon", "cargo_bench_support"] }
proptest = "1.11"  # Property-based testing for mathematical functions (Issue #573)
naga = { version = "29", features = ["wgsl-in"] }  # WGSL parse/validate for shader behaviour tests (Issue #1467)

