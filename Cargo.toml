[profile.release]
lto = "fat"
codegen-units = 1

# Lint configuration — single source of truth (Issue #675, #876)
# All clippy lints are configured here. quality.sh and CI just pass -D warnings.
#
# Rustc lints (Issue #1255) — enforce a deny floor at the crate root so CI
# fails fast when a contributor introduces a bare `unsafe` op inside an
# `unsafe fn`. The codebase already follows this style throughout
# `src/ffi/utilities.rs` etc.; this lint makes the convention enforceable.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
uninlined_format_args = "deny"
filter_next = "deny"
collapsible_if = "deny"

# Pedantic lints — useful subset that improves code quality
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
map_unwrap_or = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
unnested_or_patterns = "warn"

# Numeric safety lints — prevent regressions from Issue #805 (Issue #873) 
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"

# Code clarity lints (Issue #873)
default_trait_access = "warn"
doc_markdown = "warn"
match_bool = "warn"

# Nursery lints — stable enough to be useful
redundant_clone = "warn"

# Safety documentation — every `unsafe { ... }` block must carry a `// SAFETY:`
# comment naming the invariants the caller upholds (Issue #1240).
undocumented_unsafe_blocks = "warn"

