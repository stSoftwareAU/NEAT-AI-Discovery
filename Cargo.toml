[package]
name = "neat_ai_discovery"
version = "0.9.13"
edition = "2021"

[lib]
name = "neat_ai_discovery"
crate-type = ["cdylib", "rlib"]  # cdylib for .so/.dylib, rlib for Rust integration

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parquet = "57.0"  # Apache Parquet format (viewable with standard tools)
arrow = { version = "57.0", default-features = false }  # Arrow arrays for Parquet
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }
rayon = "1.8"
rand = "0.8"
once_cell = "1.19"
uuid = { version = "1.6", features = ["v4"] }  # Session ID generation for streaming API

crossbeam-channel = "0.5"  # Efficient multi-producer work queues for GPU thread
dashmap = "5.5"  # Lock-free concurrent HashMap for diagnostic aggregation (Issue #216)
parking_lot = { version = "0.12", features = ["deadlock_detection"] }  # Deadlock detection
signal-hook = "0.3"  # Signal handling (SIGUSR1 for thread dumps)

[dev-dependencies]
tempfile = "3.8"
serial_test = "3.0"
criterion = { version = "0.5", default-features = false, features = ["rayon", "cargo_bench_support"] }

[[bench]]
name = "synapse_counts"
harness = false

[[bench]]
name = "neuron_interning"
harness = false

[[bench]]
name = "batched_activation"
harness = false

[[bench]]
name = "cache_locality"
harness = false

[[bench]]
name = "zero_copy_buffer"
harness = false

[[bench]]
name = "sample_locality"
harness = false

[[bench]]
name = "tiered_loading"
harness = false

