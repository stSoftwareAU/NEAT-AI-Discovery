[package]
name = "neat_ai_discovery"
version = "0.35.2"
edition = "2024"

[lib]
name = "neat_ai_discovery"
crate-type = ["cdylib", "rlib"]  # cdylib for .so/.dylib, rlib for Rust integration

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
parquet = "57.3"  # Apache Parquet format (viewable with standard tools)
arrow = { version = "57.3", default-features = false }  # Arrow arrays for Parquet
wgpu = "28"
pollster = "0.4"
bytemuck = { version = "1.25", features = ["derive"] }
rayon = "1.11"
rand = "0.8"
once_cell = "1.21"
uuid = { version = "1.21", features = ["v4"] }  # Session ID generation for streaming API

crossbeam-channel = "0.5"  # Efficient multi-producer work queues for GPU thread
lz4_flex = "0.11"  # Pure Rust LZ4 compression for memory-constrained cache (Issue #420)
dashmap = "5.5"  # Lock-free concurrent HashMap for diagnostic aggregation (Issue #216)
parking_lot = { version = "0.12", features = ["deadlock_detection"] }  # Deadlock detection
signal-hook = "0.3"  # Signal handling (SIGUSR1 for thread dumps)
tracing = "0.1"  # Structured logging framework (Issue #575)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }  # Subscriber with EnvFilter (Issue #575)

[dev-dependencies]
tempfile = "3.25"
serial_test = "3.3"
criterion = { version = "0.5", default-features = false, features = ["rayon", "cargo_bench_support"] }
proptest = "1.10"  # Property-based testing for mathematical functions (Issue #573)

[[bench]]
name = "synapse_counts"
harness = false

[[bench]]
name = "neuron_interning"
harness = false

[[bench]]
name = "batched_activation"
harness = false

[[bench]]
name = "cache_locality"
harness = false

[[bench]]
name = "zero_copy_buffer"
harness = false

[[bench]]
name = "sample_locality"
harness = false

[[bench]]
name = "tiered_loading"
harness = false

[[bench]]
name = "parallel_discovery"
harness = false

[[bench]]
name = "memory_streaming"
harness = false

[[bench]]
name = "clone_reduction"
harness = false

[[bench]]
name = "upsert_candidate"
harness = false

[[bench]]
name = "gpu_buffer_transfers"
harness = false

[[bench]]
name = "async_pipeline"
harness = false

[[bench]]
name = "gpu_shader_workgroup"
harness = false

