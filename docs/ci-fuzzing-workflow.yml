# ==============================================================================
# Fuzzing CI Workflow — runs fuzz targets to catch deserialisation panics and
# FFI boundary issues before merge.
#
# To enable: copy this file to .github/workflows/fuzzing.yml
# (Requires the 'workflow' OAuth scope to push workflow files.)
#
# Part of issue #875.
# ==============================================================================

name: Fuzzing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - Develop
  schedule:
    # Run nightly at 02:00 UTC for longer fuzzing sessions
    - cron: '0 2 * * *'
  workflow_dispatch:

# Cancel superseded runs on the same ref (Issue #1288, Issue #2478).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only GITHUB_TOKEN scope (Issue #1286, Issue #2478).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzzing:
    name: Fuzz Targets
    runs-on: ubuntu-latest
    # Cap the fuzzing job so a wedged step fails fast (Issue #1287).
    timeout-minutes: 30

    steps:
    # persist-credentials: false — this job only reads the tree to fuzz it;
    # the GITHUB_TOKEN must not be written to .git/config (Issues #1648,
    # #1868, #2478).
    - name: Checkout code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Free up runner disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/share/swift

    - name: Install nightly toolchain
      run: rustup install nightly

    # Pinned with --locked and --version so a poisoned cargo-fuzz release (or any
    # transitive dependency) cannot execute its build.rs with this workflow's
    # GITHUB_TOKEN (Issue #1223, extended repo-wide by Issue #1912).
    - name: Install cargo-fuzz
      run: cargo +nightly install --locked --version 0.13.2 cargo-fuzz

    - name: Cache dependencies
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
        restore-keys: |
          ${{ runner.os }}-fuzz-

    # CI's version-increment job bumps Cargo.toml but not fuzz/Cargo.lock, so
    # restamp its path-package version before the --locked runs (Issue #2506).
    - name: Sync fuzz/Cargo.lock version
      run: |
        quality/fuzz_lockfile.sh sync
        quality/fuzz_lockfile.sh check

    # --locked honours the committed fuzz/Cargo.lock so CI fuzz runs use the
    # pinned, reviewed dependency tree rather than re-resolving (Issue #1427).
    - name: Fuzz FFI deserialisation
      run: cargo +nightly fuzz run --locked fuzz_ffi_deserialisation -- -max_total_time=30

    - name: Fuzz FFI entry points
      run: cargo +nightly fuzz run --locked fuzz_ffi_entry_points -- -max_total_time=30
