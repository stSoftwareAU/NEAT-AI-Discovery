# cargo-deny configuration for NEAT-AI-Discovery
# https://embarkstudios.github.io/cargo-deny/
#
# Run: cargo deny check
# This file enforces licence compliance, bans unsafe dependencies,
# detects duplicates, and scans for known vulnerabilities.

[graph]
targets = []
all-features = true

# =============================================================================
# Licences — only allow licences compatible with Apache-2.0
# =============================================================================
[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",

]
confidence-threshold = 0.8

# LGPL-2.1-or-later: r-efi is a UEFI runtime interface crate, only relevant
# on UEFI targets.  It is a transitive dependency (via getrandom) and is not
# linked into macOS or standard Linux builds.  The LGPL permits dynamic linking
# without imposing copyleft on the larger work.
[[licenses.exceptions]]
name = "r-efi"
allow = ["LGPL-2.1-or-later"]

# =============================================================================
# Bans — prevent unwanted or duplicate crates
# =============================================================================
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "lowest-version"

# =============================================================================
# Advisories — scan for known vulnerabilities via the RustSec advisory database
# =============================================================================
[advisories]
# An ignore that no longer matches any crate is not harmless: it silently
# re-suppresses the advisory if that crate ever re-enters the graph, on the
# strength of a risk assessment written for a different dependency shape. Fail
# the check instead of warning, so a stale suppression is caught by the tooling
# rather than by an audit years later (Issue #1917).
unused-ignored-advisory = "deny"
# No advisory is suppressed. RUSTSEC-2024-0436 (paste, unmaintained) was
# ignored while parquet pulled `paste` in transitively; parquet 59.3.0 completed
# the migration to `pastey` the ignore was waiting on, so `paste` left
# Cargo.lock and the ignore matched nothing. `unused-ignored-advisory = "deny"`
# then failed every `cargo deny check`, which disabled dependency bumps for the
# repo until the dead entry was removed (Issue #2054).
ignore = []

# =============================================================================
# Sources — only allow crates from crates.io
# =============================================================================
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
